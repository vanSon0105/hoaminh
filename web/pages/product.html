<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm - Họa Minh</title>
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/product.css" />
    <script src="../assets/js/session.js" defer></script>
    <script src="../assets/js/product.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="header-top">
          <a class="brand-link" href="../index.html" aria-label="Họa Minh trang chủ">
            <img class="brand-logo" src="../assets/images/logo.png" alt="Họa Minh" />
          </a>
          <div class="header-actions">
            <a class="icon-link" href="account.html" aria-label="Tài khoản"><i class="fa-regular fa-circle-user" aria-hidden="true"></i></a>
            <a class="icon-link" href="cart.html" aria-label="Giỏ hàng"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i></a>
            <form class="search-form" action="product.html">
              <input type="search" name="q" placeholder="Tìm kiếm..." aria-label="Tìm kiếm" />
              <button type="submit" aria-label="Tìm kiếm"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></button>
            </form>
          </div>
        </div>
        <nav class="site-nav" data-site-nav>
          <div class="nav-inner">
            <button class="mobile-menu-button" type="button" data-menu-toggle aria-label="Mở menu"><span class="hamburger" aria-hidden="true"></span></button>
            <div class="nav-links">
              <div class="nav-links-inner">
                <a class="nav-link" href="../index.html">Trang chủ</a>
                <a class="nav-link is-active" href="product.html">Sản phẩm</a>
                <a class="nav-link" href="information.html">Thông tin</a>
                <a class="nav-link" href="cart.html">Giỏ hàng</a>
                <a class="nav-link" href="checkout.html">Thanh toán</a>
              </div>
            </div>
          </div>
        </nav>
      </header>

      <main class="product-page">
        <section class="trend-section">
          <div class="container">
            <h1 class="section-title reveal">Top sản phẩm xu hướng</h1>
            <div class="trend-grid reveal" data-trend-grid></div>
          </div>
        </section>

        <section class="all-products">
          <div class="container">
            <div class="product-grid reveal" data-product-grid></div>
            <div class="load-more-wrap reveal">
              <button class="load-more" type="button" data-load-more aria-label="Xem thêm sản phẩm">+</button>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-inner">
          <div class="footer-brand">
            <img class="brand-logo" src="../assets/images/logo.png" alt="Họa Minh" />
            <div class="social-row">
              <a class="social-link" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a>
              <a class="social-link" href="#" aria-label="Twitter"><i class="fa-brands fa-twitter" aria-hidden="true"></i></a>
              <a class="social-link" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
            </div>
          </div>
          <div>
            <h3 class="footer-title">Về chúng tôi</h3>
            <div class="footer-list">
              <a href="../index.html">Trang chủ</a>
              <a href="product.html">Sản phẩm</a>
              <a href="information.html">Thông tin</a>
              <a href="cart.html">Giỏ hàng</a>
              <a href="checkout.html">Thanh toán</a>
            </div>
          </div>
          <div>
            <h3 class="footer-title">Cơ hội</h3>
            <div class="footer-list"><a href="#">Jobs</a><a href="#">Affiliates</a></div>
          </div>
          <div>
            <h3 class="footer-title">Liên hệ</h3>
            <div class="footer-list"><a href="#">Facebook</a><a href="#">Instagram</a><a href="#">Tiktok</a><a href="#">Twitter</a></div>
          </div>
        </div>
        <div class="footer-bottom">
          <span>©2026 Moc Co.</span>
          <div class="footer-policies"><a href="#">Chính sách và quyền riêng tư</a><a href="#">Điều khoản sử dụng</a></div>
        </div>
      </footer>
    </div>
    <div class="toast" data-toast></div>
  </body>
</html>
